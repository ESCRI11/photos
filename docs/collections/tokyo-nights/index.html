<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokyo Nights — Portfolio</title>
  <link rel="stylesheet" href="/photos/styles.css">
</head>
<body>
  <nav class="site-nav">
    <div class="nav-inner">
      <div class="nav-row">
        <a href="/photos/" class="nav-brand font-serif">Xavier Escrib&agrave; Montagut</a>
        <div class="nav-links-desktop">
          <a href="/photos/" class="nav-link" data-nav-href="/photos/">Work</a>
          <a href="/photos/topics/" class="nav-link" data-nav-href="/photos/topics/">Topics</a>
        </div>
        <button id="menu-toggle" class="nav-menu-btn" aria-label="Toggle menu">
          <span id="menu-icon-open"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></span>
          <span id="menu-icon-close" style="display:none"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
        </button>
      </div>
      <div id="mobile-menu" class="nav-mobile">
        <a href="/photos/" class="nav-link" data-nav-href="/photos/">Work</a>
        <a href="/photos/topics/" class="nav-link" data-nav-href="/photos/topics/">Topics</a>
      </div>
    </div>
  </nav>

  <main>
    
    <section class="collection-section">
      <div class="collection-container">
        <a href="/photos/topics/" class="back-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back to Topics
        </a>
        <div class="collection-header">
          <h1 class="font-serif tracking-tight">Tokyo Nights</h1>
          <p class="tracking-wide text-muted">Urban exploration through the neon-lit streets of Tokyo</p>
        </div>
        <div class="photo-grid">
          <div class="photo-item md:col-span-2 md:row-span-1 animate-fade-in-up" data-index="0" style="animation-delay:0ms" role="button" tabindex="0" aria-label="Open photo: Architectural photography">
      <img src="/photos/black-and-white-architecture.png" alt="Architectural photography" loading="eager">
      <div class="photo-overlay"></div>
    </div>
    <div class="photo-item md:col-span-1 md:row-span-1 animate-fade-in-up" data-index="1" style="animation-delay:100ms" role="button" tabindex="0" aria-label="Open photo: Abstract photography">
      <img src="/photos/abstract-minimalist-photography.jpg" alt="Abstract photography" loading="eager">
      <div class="photo-overlay"></div>
    </div>
    <div class="photo-item md:col-span-1 md:row-span-2 animate-fade-in-up" data-index="2" style="animation-delay:200ms" role="button" tabindex="0" aria-label="Open photo: Street photography">
      <img src="/photos/urban-street-photography-monochrome.jpg" alt="Street photography" loading="eager">
      <div class="photo-overlay"></div>
    </div>
        </div>
      </div>
    </section>
    <script id="page-photos" type="application/json">[{"id":"architecture-1","src":"/photos/black-and-white-architecture.png","alt":"Architectural photography","metadata":{"camera":"Sony A7R V","lens":"Sony FE 16-35mm f/2.8 GM","focalLength":"16mm","aperture":"f/8","shutterSpeed":"1/320s","iso":"100","date":"June 3, 2024","location":"Chicago, Illinois"}},{"id":"abstract-1","src":"/photos/abstract-minimalist-photography.jpg","alt":"Abstract photography","metadata":{"camera":"Canon EOS R5","lens":"Canon RF 50mm f/1.2","focalLength":"50mm","aperture":"f/2.8","shutterSpeed":"1/125s","iso":"800","date":"March 17, 2024","location":"Roppongi, Tokyo"}},{"id":"street-1","src":"/photos/urban-street-photography-monochrome.jpg","alt":"Street photography","metadata":{"camera":"Sony A7III","lens":"Sony FE 35mm f/1.8","focalLength":"35mm","aperture":"f/1.8","shutterSpeed":"1/60s","iso":"3200","date":"March 15, 2024","location":"Shibuya, Tokyo"}}]</script>
  </main>

  <footer>
    <div class="footer-inner">
      <p>&copy; 2026 Xavier Escrib&agrave; Montagut. All rights reserved.</p>
    </div>
  </footer>

  <!-- Lightbox (shared, populated by JS) -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo lightbox">
    <button id="lb-close" class="lb-close-btn" aria-label="Close lightbox"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <button id="lb-info"  class="lb-info-btn"  aria-label="Toggle info (I)" title="Toggle info (I)"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button>
    <button id="lb-prev"  class="lb-prev-btn"  aria-label="Previous image"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
    <button id="lb-next"  class="lb-next-btn"  aria-label="Next image"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></button>
    <div class="lb-content" id="lb-backdrop">
      <div class="lb-image-wrapper">
        <img id="lb-img" src="" alt="">
      </div>
      <div id="lb-meta" class="lb-meta"></div>
    </div>
    <div id="lb-counter"></div>
  </div>

  <script src="/photos/app.js"></script>
</body>
</html>
