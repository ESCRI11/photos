<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portraits — Xavier Escribà Montagut</title>
  <link rel="stylesheet" href="/photos/styles.css">
</head>
<body>
  <nav class="site-nav">
    <div class="nav-inner">
      <div class="nav-row">
        <a href="/photos/" class="nav-brand font-serif">Xavier Escrib&agrave; Montagut</a>
        <div class="nav-links-desktop">
          <a href="/photos/" class="nav-link" data-nav-href="/photos/">Fotos</a>
          <a href="/photos/topics/" class="nav-link" data-nav-href="/photos/topics/">Àlbums</a>
        </div>
        <button id="menu-toggle" class="nav-menu-btn" aria-label="Obrir el menú">
          <span id="menu-icon-open"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></span>
          <span id="menu-icon-close" style="display:none"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
        </button>
      </div>
      <div id="mobile-menu" class="nav-mobile">
        <a href="/photos/" class="nav-link" data-nav-href="/photos/">Fotos</a>
        <a href="/photos/topics/" class="nav-link" data-nav-href="/photos/topics/">Àlbums</a>
      </div>
    </div>
  </nav>

  <main>
    
    <section class="collection-section">
      <div class="collection-container">
        <a href="/photos/topics/" class="back-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Tornar als àlbums
        </a>
        <div class="collection-header">
          <h1 class="font-serif tracking-tight">Portraits</h1>
          <p class="tracking-wide text-muted">Intimate moments captured in black and white</p>
        </div>
        <div class="photo-grid">
          <div class="photo-item md:col-span-1 md:row-span-2 animate-fade-in-up" data-index="0" style="animation-delay:0ms" role="button" tabindex="0" aria-label="Obrir foto: Portrait photography">
      <img src="/photos/minimalist-black-and-white-portrait-photography.jpg" alt="Portrait photography" loading="eager">
      <div class="photo-overlay"></div>
    </div>
    <div class="photo-item md:col-span-2 md:row-span-1 animate-fade-in-up" data-index="1" style="animation-delay:100ms" role="button" tabindex="0" aria-label="Obrir foto: Fine art photography">
      <img src="/photos/fine-art-photography-black-background.jpg" alt="Fine art photography" loading="eager">
      <div class="photo-overlay"></div>
    </div>
        </div>
      </div>
    </section>
    <script id="page-photos" type="application/json">[{"id":"portrait-1","src":"/photos/minimalist-black-and-white-portrait-photography.jpg","alt":"Portrait photography","metadata":{"camera":"Nikon Z9","lens":"Nikkor Z 85mm f/1.8","focalLength":"85mm","aperture":"f/2","shutterSpeed":"1/200s","iso":"400","date":"April 5, 2024","location":"Studio, New York"}},{"id":"fine-art-1","src":"/photos/fine-art-photography-black-background.jpg","alt":"Fine art photography","metadata":{"camera":"Sony A7R IV","lens":"Sony FE 85mm f/1.4 GM","focalLength":"85mm","aperture":"f/1.4","shutterSpeed":"1/160s","iso":"100","date":"April 8, 2024","location":"Studio, New York"}}]</script>
  </main>

  <footer>
    <div class="footer-inner">
      <p>&copy; 2026 Xavier Escrib&agrave; Montagut. Tots els drets reservats.</p>
    </div>
  </footer>

  <!-- Lightbox (shared, populated by JS) -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Visualitzador de fotos">
    <button id="lb-close" class="lb-close-btn" aria-label="Tancar"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <button id="lb-info"  class="lb-info-btn"  aria-label="Informació (I)" title="Informació (I)"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button>
    <button id="lb-prev"  class="lb-prev-btn"  aria-label="Imatge anterior"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
    <button id="lb-next"  class="lb-next-btn"  aria-label="Imatge següent"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></button>
    <div class="lb-content" id="lb-backdrop">
      <div class="lb-image-wrapper">
        <img id="lb-img" src="" alt="">
      </div>
      <div id="lb-meta" class="lb-meta"></div>
    </div>
    <div id="lb-counter"></div>
  </div>

  <script src="/photos/app.js"></script>
</body>
</html>
