</head>
<body>
  <nav class="site-nav">

      <div class="nav-row">

          <a href="/photos/topics/" class="nav-link" data-nav-href="/photos/topics/">Àlbums</a>
        </div>
        <button id="menu-toggle" class="nav-menu-btn" aria-label="Obrir el menú">
          <span id="menu-icon-open"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></span>
          <span id="menu-icon-close" style="display:none"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
        </button>
      </div>
      <div id="mobile-menu" class="nav-mobile">
        <a href="/photos/" class="nav-link" data-nav-href="/photos/">Fotos</a>
        <a href="/photos/topics/" class="nav-link" data-nav-href="/photos/topics/">Àlbums</a>
      </div>
    </div>
  </nav>

  <main>
    
    <section class="gallery-section">
      <div class="gallery-container">
        <h2 class="font-serif">Les meves fotos</h2>
        <div class="photo-grid">
          <div class="photo-item md:col-span-1 md:row-span-2 animate-fade-in-up" data-index="0" style="animation-delay:0ms" role="button" tabindex="0" aria-label="Obrir foto: Portrait photography">
      <img src="/photos/minimalist-black-and-white-portrait-photography.jpg" alt="Portrait photography" loading="eager">
      <div class="photo-overlay"></div>
    </div>
    <div class="photo-item md:col-span-2 md:row-span-1 animate-fade-in-up" data-index="1" style="animation-delay:100ms" role="button" tabindex="0" aria-label="Obrir foto: Architectural photography">
      <img src="/photos/black-and-white-architecture.png" alt="Architectural photography" loading="eager">
      <div class="photo-overlay"></div>
    </div>
    <div class="photo-item md:col-span-1 md:row-span-1 animate-fade-in-up" data-index="2" style="animation-delay:200ms" role="button" tabindex="0" aria-label="Obrir foto: Abstract photography">
      <img src="/photos/abstract-minimalist-photography.jpg" alt="Abstract photography" loading="eager">
      <div class="photo-overlay"></div>
    </div>
    <div class="photo-item md:col-span-1 md:row-span-1 animate-fade-in-up" data-index="3" style="animation-delay:300ms" role="button" tabindex="0" aria-label="Obrir foto: Nature photography">
      <img src="/photos/nature-landscape-black-and-white.jpg" alt="Nature photography" loading="lazy">
      <div class="photo-overlay"></div>
    </div>
    <div class="photo-item md:col-span-1 md:row-span-2 animate-fade-in-up" data-index="4" style="animation-delay:400ms" role="button" tabindex="0" aria-label="Obrir foto: Street photography">
      <img src="/photos/urban-street-photography-monochrome.jpg" alt="Street photography" loading="lazy">
      <div class="photo-overlay"></div>
    </div>
    <div class="photo-item md:col-span-2 md:row-span-1 animate-fade-in-up" data-index="5" style="animation-delay:500ms" role="button" tabindex="0" aria-label="Obrir foto: Fine art photography">
      <img src="/photos/fine-art-photography-black-background.jpg" alt="Fine art photography" loading="lazy">
      <div class="photo-overlay"></div>
    </div>
        </div>
      </div>
    </section>
    <script id="page-photos" type="application/json">[{"id":"portrait-1","src":"/photos/minimalist-black-and-white-portrait-photography.jpg","alt":"Portrait photography","metadata":{"camera":"Nikon Z9","lens":"Nikkor Z 85mm f/1.8","focalLength":"85mm","aperture":"f/2","shutterSpeed":"1/200s","iso":"400","date":"April 5, 2024","location":"Studio, New York"}},{"id":"architecture-1","src":"/photos/black-and-white-architecture.png","alt":"Architectural photography","metadata":{"camera":"Sony A7R V","lens":"Sony FE 16-35mm f/2.8 GM","focalLength":"16mm","aperture":"f/8","shutterSpeed":"1/320s","iso":"100","date":"June 3, 2024","location":"Chicago, Illinois"}},{"id":"abstract-1","src":"/photos/abstract-minimalist-photography.jpg","alt":"Abstract photography","metadata":{"camera":"Canon EOS R5","lens":"Canon RF 50mm f/1.2","focalLength":"50mm","aperture":"f/2.8","shutterSpeed":"1/125s","iso":"800","date":"March 17, 2024","location":"Roppongi, Tokyo"}},{"id":"nature-1","src":"/photos/nature-landscape-black-and-white.jpg","alt":"Nature photography","metadata":{"camera":"Canon EOS R5","lens":"Canon RF 24-70mm f/2.8","focalLength":"24mm","aperture":"f/11","shutterSpeed":"1/500s","iso":"100","date":"May 12, 2024","location":"Yosemite, California"}},{"id":"street-1","src":"/photos/urban-street-photography-monochrome.jpg","alt":"Street photography","metadata":{"camera":"Sony A7III","lens":"Sony FE 35mm f/1.8","focalLength":"35mm","aperture":"f/1.8","shutterSpeed":"1/60s","iso":"3200","date":"March 15, 2024","location":"Shibuya, Tokyo"}},{"id":"fine-art-1","src":"/photos/fine-art-photography-black-background.jpg","alt":"Fine art photography","metadata":{"camera":"Sony A7R IV","lens":"Sony FE 85mm f/1.4 GM","focalLength":"85mm","aperture":"f/1.4","shutterSpeed":"1/160s","iso":"100","date":"April 8, 2024","location":"Studio, New York"}}]</script>
  </main>

  <footer>
    <div class="footer-inner">
      <p>&copy; 2026 Xavier Escrib&agrave; Montagut. Tots els drets reservats.</p>
    </div>
  </footer>

  <!-- Lightbox (shared, populated by JS) -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Visualitzador de fotos">
    <button id="lb-close" class="lb-close-btn" aria-label="Tancar"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <button id="lb-info"  class="lb-info-btn"  aria-label="Informació (I)" title="Informació (I)"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button>
    <button id="lb-prev"  class="lb-prev-btn"  aria-label="Imatge anterior"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
    <button id="lb-next"  class="lb-next-btn"  aria-label="Imatge següent"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></button>
    <div class="lb-content" id="lb-backdrop">
      <div class="lb-image-wrapper">
        <img id="lb-img" src="" alt="">
      </div>
      <div id="lb-meta" class="lb-meta"></div>
    </div>
    <div id="lb-counter"></div>
  </div>

  <script src="/photos/app.js"></script>
</body>
</html>
